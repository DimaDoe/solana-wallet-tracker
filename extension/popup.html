<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1RW Verification</title>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0f23, #1e1b4b);
      color: white;
      margin: 0;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #6366f1;
    }

    .title {
      font-size: 14px;
      color: #a0a0a0;
    }

    .status {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .status-label {
      font-size: 12px;
      color: #a0a0a0;
      margin-bottom: 4px;
    }

    .status-value {
      font-size: 14px;
      font-weight: 500;
    }

    .status-value.active {
      color: #22c55e;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-bottom: 8px;
    }

    .btn:hover {
      background: #4f46e5;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #666;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">1RW</span>
    <span class="title">Human Verification</span>
  </div>

  <div class="status">
    <div class="status-label">Extension Status</div>
    <div class="status-value active">Active</div>
  </div>

  <a href="https://1rw.io/verify" target="_blank" class="btn">
    Get Verified
  </a>

  <a href="https://1rw.io/check" target="_blank" class="btn btn-secondary">
    Check a Wallet
  </a>

  <div class="footer">
    Showing badges on Twitter/X profiles
  </div>

  <script src="popup.js"></script>
</body>
</html>
